kind = "web"
previewPath = "/"
title = "Framer Export"
version = "1.0.0"
id = "artifacts/framer-export"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23414

[services.development]
run = "pnpm --filter @workspace/framer-export run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/framer-export", "run", "build" ]
serve = "static"
publicDir = "artifacts/framer-export/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23414"
BASE_PATH = "/"
