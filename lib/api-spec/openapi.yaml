openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Framer to HTML converter API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: conversions
    description: Framer site conversion jobs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /conversions:
    get:
      operationId: listConversions
      tags: [conversions]
      summary: List recent conversion jobs for this session
      responses:
        "200":
          description: List of conversion jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversionJob"
    post:
      operationId: startConversion
      tags: [conversions]
      summary: Start a new Framer site conversion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversionInput"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionJob"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversions/{id}:
    get:
      operationId: getConversion
      tags: [conversions]
      summary: Get conversion job status and file list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversion job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversions/{id}/stats:
    get:
      operationId: getConversionStats
      tags: [conversions]
      summary: Get aggregated file type stats for a completed job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stats breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionStats"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ConversionInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The Framer site URL to convert

    ConversionFile:
      type: object
      required: [path, originalUrl, size, mimeType, category]
      properties:
        path:
          type: string
          description: Relative path in the output bundle
        originalUrl:
          type: string
          description: The original URL this file was fetched from
        size:
          type: number
          description: File size in bytes
        mimeType:
          type: string
        category:
          type: string
          description: "html | css | js | image | font | json | other"

    ConversionJob:
      type: object
      required: [id, url, status, progress, message, totalFiles, totalSizeBytes, files, previewPath, createdAt]
      properties:
        id:
          type: string
        url:
          type: string
        status:
          type: string
          description: "pending | crawling | downloading | processing | done | error"
        progress:
          type: number
          description: 0-100
        message:
          type: string
        totalFiles:
          type: number
        totalSizeBytes:
          type: number
        files:
          type: array
          items:
            $ref: "#/components/schemas/ConversionFile"
        previewPath:
          type: ["string", "null"]
          description: URL path to preview the converted site
        downloadPath:
          type: ["string", "null"]
          description: URL path to download the ZIP
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]

    ConversionStats:
      type: object
      required: [jobId, byCategory, totalFiles, totalSizeBytes]
      properties:
        jobId:
          type: string
        totalFiles:
          type: number
        totalSizeBytes:
          type: number
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryStat"

    CategoryStat:
      type: object
      required: [category, count, sizeBytes]
      properties:
        category:
          type: string
        count:
          type: number
        sizeBytes:
          type: number

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
